name: Build iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-ios-ipa:
    name: Build iOS App (.ipa)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Pre-compile Kotlin Multiplatform iOS Framework
        run: |
          ./gradlew :shared:compileKotlinIosArm64 --stacktrace

      - name: Build Xcode Archive (.xcarchive)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ReminiSkinAI.xcarchive \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa File
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/ReminiSkinAI.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app directory found inside xcarchive!"
            exit 1
          fi
          echo "Packaging application from: $APP_PATH"
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ReminiSkinAI.ipa Payload
          cd ../..

      - name: Upload .ipa as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminiSkinAI-iOS-ipa
          path: build/ipa/ReminiSkinAI.ipa
          retention-days: 14
